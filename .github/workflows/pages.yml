name: Deploy osu Hub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "pages/**"
      - "css/**"
      - "js/**"
      - "data/site.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/pages _site/css _site/js _site/data
          cp index.html _site/index.html
          cp -R pages/. _site/pages/
          cp -R css/. _site/css/
          cp -R js/. _site/js/
          cp data/site.json _site/data/site.json
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
