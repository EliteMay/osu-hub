name: Refresh osu API Token

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-osu-token.yml"
      - "data/site.json"

permissions:
  contents: read

concurrency:
  group: osu-hub-api-production
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Supabase osu token
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in OSU_CLIENT_ID OSU_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: ${name}"
              exit 1
            fi
          done

      - name: Resolve Supabase Sync API endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(node -e '
            const fs = require("fs");
            const site = JSON.parse(fs.readFileSync("data/site.json", "utf8"));
            const value = String(site?.osuApi?.endpointUrl || "");
            if (!/^https:\/\/[^/]+\.supabase\.co\/functions\/v1\/osu-sync$/.test(value)) process.exit(2);
            process.stdout.write(value);
          ')"
          printf 'SYNC_ENDPOINT=%s\n' "$endpoint" >> "$GITHUB_ENV"
          echo "Sync endpoint resolved from data/site.json."

      - name: Refresh token in Supabase
        shell: bash
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$request_file" "$response_file"' EXIT

          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              action: "refresh",
              clientId: process.env.OSU_CLIENT_ID,
              clientSecret: process.env.OSU_CLIENT_SECRET,
            }));
          ' "$request_file"

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --request POST "$SYNC_ENDPOINT" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file")"

          if [ "$status" != "200" ]; then
            echo "::error::Supabase token refresh failed (HTTP ${status})."
            cat "$response_file"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value?.ok !== true || value?.tokenStored !== true || !value?.expiresAt) throw new Error("Unexpected refresh response");
            console.log(`Supabase token refresh: OK (expires ${value.expiresAt})`);
          ' "$response_file"

      - name: Verify Supabase health and osu sync
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request POST "$SYNC_ENDPOINT" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"action":"health"}')"

          printf '%s' "$health" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value?.ok !== true || value?.configured !== true) throw new Error("Supabase sync health is not ready");
            if (value?.service !== "osu-hub-sync" || value?.provider !== "supabase-edge-function") throw new Error("Unexpected sync provider");
            if (value?.browserOAuthRequired !== false) throw new Error("Browser OAuth credentials must not be required");
            console.log("Supabase sync health: OK");
          '

          sync="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request POST "$SYNC_ENDPOINT" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"action":"sync","user":"2","mode":"osu","limit":1,"includeFails":true}')"

          printf '%s' "$sync" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value?.apiVersion !== 1 || value?.provider !== "supabase-edge-function") throw new Error("Unexpected sync response");
            if (!value?.user || Number(value.user.id) !== 2) throw new Error("Get User smoke test failed");
            if (!Array.isArray(value.scores) || value.scores.length > 1) throw new Error("Recent Scores smoke test failed");
            console.log(`Supabase account-sync smoke test: OK (${value.scores.length} recent score(s))`);
          '

      - name: Record refresh result
        shell: bash
        run: |
          {
            echo "## osu! API token refresh"
            echo
            echo "- Provider: Supabase Edge Function"
            echo "- Client ID / Secret source: GitHub Actions Secrets"
            echo "- Client Secret stored in Supabase: no"
            echo "- Access Token stored in RLS-protected table: yes"
            echo "- /health: OK"
            echo "- Account Sync smoke: OK"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
