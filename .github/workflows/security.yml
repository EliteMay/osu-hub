name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 18 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    uses: EliteMay/.github/.github/workflows/reusable-javascript-security.yml@036a66554c0ecf2c2e7fb5618c74c4706e16996c
    with:
      fail-on-severity: high
