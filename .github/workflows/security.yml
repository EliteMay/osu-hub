name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 18 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    uses: EliteMay/.github/.github/workflows/reusable-javascript-security.yml@07a1193ba26bf0ebaa9d88cc3f2ecfb17b3431ea
    with:
      fail-on-severity: high
