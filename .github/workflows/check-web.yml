name: Check web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "pages/**"
      - "css/**"
      - "js/**"
      - "data/site.json"
      - "data/config.json"
      - "project-meta.json"
      - "version.json"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "仕様書.md"
      - "作業報告書.md"
      - "cloudflare/worker/**"
      - "tests/**"
      - ".github/workflows/check-web.yml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/refresh-osu-token.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "pages/**"
      - "css/**"
      - "js/**"
      - "data/site.json"
      - "data/config.json"
      - "project-meta.json"
      - "version.json"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "仕様書.md"
      - "作業報告書.md"
      - "cloudflare/worker/**"
      - "tests/**"
      - ".github/workflows/check-web.yml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/refresh-osu-token.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check js/storage.js
          node --check js/app.js
          node --check js/osu-sync.js
          node --check js/site-meta.js
          node --check cloudflare/worker/src/index.js
          node --check tests/validate-web.mjs

      - name: Check JSON
        run: |
          python -m json.tool data/site.json > /dev/null
          python -m json.tool data/config.json > /dev/null
          python -m json.tool project-meta.json > /dev/null
          python -m json.tool version.json > /dev/null
          python -m json.tool package.json > /dev/null
          python -m json.tool cloudflare/worker/package.json > /dev/null

      - name: Validate web project
        run: node tests/validate-web.mjs

      - name: Check tracked secret files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(\.env|\.dev\.vars)($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked secret-like files detected:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env/.dev.vars secret files."
