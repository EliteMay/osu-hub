name: Deploy osu Hub API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: osu-hub-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          wranglerVersion: "4.127.1"
          command: deploy

      - name: Verify deployed Worker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "::error::Wrangler did not return a deployment URL."
            exit 1
          fi

          base_url="${DEPLOYMENT_URL%/}"
          echo "Worker URL: ${base_url}"

          health="$(curl --fail --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${base_url}/health")"

          printf '%s' "$health" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value?.ok !== true) throw new Error("Worker health returned ok=false");
            if (value?.configured !== true) throw new Error("Worker is not configured");
            if (value?.service !== "osu-hub-api") throw new Error("Unexpected Worker service response");
            if (value?.upstreamMode !== "public-web") throw new Error("Worker is not using public-web upstream mode");
            if (value?.oauthRequired !== false) throw new Error("Worker unexpectedly requires osu! OAuth");
            console.log("Worker health check: OK");
          '

          # Public user ID 2 is used only as a lightweight end-to-end route probe.
          # A zero-length recent-score list is valid; the smoke test verifies that
          # profile resolution and the public Recent Scores route both return the
          # expected osu! Hub response shape without OAuth.
          sync="$(curl --fail --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${base_url}/api/sync?user=2&mode=osu&limit=1&include_fails=1")"

          printf '%s' "$sync" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value?.apiVersion !== 1) throw new Error("Unexpected sync apiVersion");
            if (value?.upstreamMode !== "public-web") throw new Error("Sync did not use public-web upstream mode");
            if (!value?.user || Number(value.user.id) !== 2) throw new Error("Public profile resolution smoke test failed");
            if (!Array.isArray(value.scores)) throw new Error("Recent Scores response is not an array");
            if (value.scores.length > 1) throw new Error("Recent Scores smoke limit was not respected");
            for (const score of value.scores) {
              if (!/^osu:\d+$/.test(String(score?.id || ""))) throw new Error("Invalid normalized score id");
            }
            console.log(`Worker account-sync smoke test: OK (${value.scores.length} recent score(s))`);
          '

          {
            echo "## Cloudflare Worker deployment"
            echo
            echo "- URL: ${base_url}"
            echo "- /health: OK"
            echo "- /api/sync public route smoke test: OK"
            echo "- osu! upstream: public profile web endpoints"
            echo "- osu! OAuth: not required"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
