name: Deploy osu Hub API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: osu-hub-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OSU_CLIENT_ID OSU_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          wranglerVersion: "4.127.1"
          command: deploy
          secrets: |
            OSU_CLIENT_ID
            OSU_CLIENT_SECRET
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}

      - name: Verify deployed Worker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "::error::Wrangler did not return a deployment URL."
            exit 1
          fi

          echo "Worker URL: ${DEPLOYMENT_URL}"
          health="$(curl --fail --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${DEPLOYMENT_URL%/}/health")"

          printf '%s' "$health" | node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value?.ok !== true) throw new Error("Worker health returned ok=false");
            if (value?.configured !== true) throw new Error("osu! OAuth secrets are not configured in Worker");
            if (value?.service !== "osu-hub-api") throw new Error("Unexpected Worker service response");
            console.log("Worker health check: OK");
          '

          {
            echo "## Cloudflare Worker deployment"
            echo
            echo "- URL: ${DEPLOYMENT_URL}"
            echo "- /health: OK"
            echo "- osu! OAuth secrets: configured"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
