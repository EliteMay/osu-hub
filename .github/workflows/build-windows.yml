name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "package.json"
      - "src/**"
      - "tools/**"
      - "tests/validate-audio-interop.mjs"
      - "tests/validate-auto-update.mjs"
      - "data/config.json"
      - "version.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "package.json"
      - "src/**"
      - "tools/**"
      - "tests/validate-audio-interop.mjs"
      - "tests/validate-auto-update.mjs"
      - "data/config.json"
      - "version.json"

permissions:
  contents: write

concurrency:
  group: osu-setup-launcher-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check Electron JavaScript syntax
        shell: pwsh
        run: |
          node --check src/bootstrap.js
          node --check src/main.js
          node --check src/updater.js
          node --check src/preload.js
          node --check src/renderer/app.js

      - name: Check audio interop regression guards
        run: node tests/validate-audio-interop.mjs

      - name: Check auto-update regression guards
        run: node tests/validate-auto-update.mjs

      - name: Check Windows audio fallback sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/switch_audio_device.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Add-Type -Path (Resolve-Path 'tools/AudioSwitcher.cs') -ErrorAction Stop

      - name: Run audio matcher self-test
        shell: powershell
        run: |
          & .\tools\switch_audio_device.ps1 -SelfTest

      - name: Build installer
        run: npm run build:win

      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $expected = "dist/osu_setup_${version}_setup.exe"
          $metadata = "dist/latest.yml"
          $blockmap = "$expected.blockmap"

          if (-not (Test-Path $expected)) {
            throw "Expected installer not found: $expected"
          }
          if (-not (Test-Path $metadata)) {
            throw "Auto-update metadata not found: $metadata"
          }
          if (-not (Test-Path $blockmap)) {
            throw "Auto-update blockmap not found: $blockmap"
          }

          $file = Get-Item $expected
          if ($file.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($file.Length) bytes"
          }
          if ((Get-Item $metadata).Length -lt 50) {
            throw "latest.yml is unexpectedly small"
          }
          if ((Get-Item $blockmap).Length -lt 50) {
            throw "blockmap is unexpectedly small"
          }

          $metadataText = Get-Content $metadata -Raw
          if ($metadataText -notmatch [regex]::Escape("osu_setup_${version}_setup.exe")) {
            throw "latest.yml does not reference the current installer version"
          }

          "INSTALLER_PATH=$((Resolve-Path $expected).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_METADATA_PATH=$((Resolve-Path $metadata).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_BLOCKMAP_PATH=$((Resolve-Path $blockmap).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAUNCHER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer verified: $($file.Name) ($([math]::Round($file.Length / 1MB, 1)) MB)"
          Write-Host "Auto-update metadata verified: latest.yml + $([IO.Path]::GetFileName($blockmap))"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-setup-launcher-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:LAUNCHER_VERSION"
          $title = "osu Setup Launcher v$env:LAUNCHER_VERSION"
          $meta = Get-Content 'version.json' -Raw | ConvertFrom-Json
          $changeText = [string]$meta.releaseNotes
          $notes = @"
          ## osu Setup Launcher v$env:LAUNCHER_VERSION

          Windows向け配布版です。

          ### 更新内容

          $changeText

          ### 主な機能

          - 音声出力切替
          - OpenTabletDriver起動
          - REAL等の遅延対策アプリ起動
          - osu!lazer自動検出 / 起動
          - v0.18.2以降のアプリ内One-click Update

          ### Auto Update

          ReleaseにはSetup.exeと同じVersionの `latest.yml` / `.blockmap` を含めます。
          v0.18.2を一度手動インストールした後は、次回以降の新版をアプリ内から更新できます。

          ### 注意

          このインストーラーはコード署名していません。Windows SmartScreenの警告が表示される場合があります。
          Update MetadataのHash検証は利用しますが、Authenticode署名による発行元検証はありません。
          GitHub ActionsでのSetup.exe生成は確認済みでも、音声切替・外部exe起動・実Windowsでの旧版→新版更新は別途実機確認が必要です。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesPath
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update release $tag" }

          gh release upload $tag $env:INSTALLER_PATH $env:UPDATE_METADATA_PATH $env:UPDATE_BLOCKMAP_PATH --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload installer/update metadata to release $tag" }

      - name: Build summary
        shell: pwsh
        run: |
          $releaseState = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { 'PR build only (not published)' } elseif ($env:GITHUB_REF -eq 'refs/heads/main') { "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:LAUNCHER_VERSION" } else { 'Build only' }
          @"
          ## Windows installer build

          - Version: $env:LAUNCHER_VERSION
          - Installer: osu_setup_${env:LAUNCHER_VERSION}_setup.exe
          - Auto update metadata: latest.yml + blockmap
          - Result: $releaseState
          - Code signing: disabled
          - Windows runtime / old-version update behavior: requires real-device verification
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
