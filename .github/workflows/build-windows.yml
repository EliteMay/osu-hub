name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "package.json"
      - "src/**"
      - "tools/**"
      - "data/config.json"
      - "version.json"

permissions:
  contents: write

concurrency:
  group: osu-setup-launcher-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run build:win

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $expected = "dist/osu_setup_${version}_setup.exe"
          if (-not (Test-Path $expected)) {
            throw "Expected installer not found: $expected"
          }
          $file = Get-Item $expected
          if ($file.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($file.Length) bytes"
          }
          "INSTALLER_PATH=$($file.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAUNCHER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer verified: $($file.Name) ($([math]::Round($file.Length / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-setup-launcher-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:LAUNCHER_VERSION"
          $title = "osu Setup Launcher v$env:LAUNCHER_VERSION"
          $notes = @"
          ## osu Setup Launcher v$env:LAUNCHER_VERSION

          Windows向け初回配布版です。

          - 音声出力切替
          - OpenTabletDriver起動
          - REAL等の遅延対策アプリ起動
          - osu!lazer自動検出 / 起動

          ### 注意

          このインストーラーはコード署名していません。Windows SmartScreenの警告が表示される場合があります。
          GitHub ActionsでのSetup.exe生成は確認済みですが、音声切替・外部exe起動などWindows実機固有の動作は環境ごとの確認が必要です。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesPath
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update release $tag" }

          gh release upload $tag $env:INSTALLER_PATH --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload installer to release $tag" }

      - name: Release summary
        shell: pwsh
        run: |
          @"
          ## Windows installer release

          - Version: $env:LAUNCHER_VERSION
          - Installer: osu_setup_${env:LAUNCHER_VERSION}_setup.exe
          - Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:LAUNCHER_VERSION
          - Code signing: disabled
          - Windows runtime behavior: requires real-device verification
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
